- capability: bubble_delete_all
  description: "delete ALL bubbles (with optional exceptions to keep), wipe all bubbles, lösche alle bubbles, alle blasen entfernen, clear the canvas, leere ideas space, broadcasts a bubble_deleted UI event for each removed bubble so the canvas updates live — NOT IMPLEMENTED (supabase-direct path): the op was a no-op that faked success — disabled 2026-07-14 so the planner routes elsewhere and the gap is reported."
  anchor_phrases:
    - "delete all bubbles"
    - "remove all bubbles"
    - "wipe all bubbles"
    - "lösche alle bubbles"
    - "alle bubbles löschen"
    - "alle blasen löschen"
    - "lösche alle blasen"
    - "leere den ideas space"
    - "clear the canvas"
  match_patterns:
    - "(delete|remove|wipe|clear|l(ö|oe)sch(e)?|entferne|leere)\\s+(all|alle|every|jede)\\s+(bubbles?|blasen?|spaces?)"
    - "(all|alle|every)\\s+(bubbles?|blasen?|spaces?)\\s+(delete|l(ö|oe)sch(e)?|entferne|wipe)"
    - "(clear|leere|wipe)\\s+(?:the\\s+|den\\s+)?(canvas|ideas[-\\s]?space|bubble[-\\s]?canvas)"
  # execution_target removed 2026-07-14: was supabase:bubble.noop (faked success). No real op → GapSentinel reports the gap.
  arg_kwarg: exceptions
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: bubble_delete
  description: "delete or remove a single bubble by name and its content, lösche die bubble X, entferne die bubble Y"
  anchor_phrases:
    - "delete the bubble"
    - "remove the bubble"
    - "lösche die bubble"
    - "entferne die bubble"
  match_patterns:
    - "(delete|remove|l(ö|oe)sch(e)?|entferne|entfernt?)\\s+(?:the\\s+|die\\s+)?bubble\\s+\\S+"
    - "(delete|remove|l(ö|oe)sch(e)?|entferne)\\s+(?:the\\s+|die\\s+)bubble\\b"
  execution_target: "supabase:bubble.delete"  # Phase 11.U.H migrated from direct:spaces.* (not in Brain image)
  arg_kwarg: bubble_name
  validator:
    # truth: ground-truth (2026-06-24) — re-query that the deleted row is GONE.
    # {result_title} = the title the op reported deleting ("Bubble 'X' deleted.") so
    # the absent-check is grounded in the op's own target, not a guessed filter.
    kind: truth:supabase_row
    on_fail: report
    postcondition:
      check: supabase_row
      table: ideas
      match: "title=eq.{result_title}"
      expect: absent

- capability: bubble_enter
  description: "enter a bubble so subsequent idea operations target it, geh in die bubble, betrete die bubble"
  anchor_phrases:
    - "enter the bubble"
    - "open the bubble"
    - "geh in die bubble"
    - "betrete die bubble"
    - "öffne die bubble"
  match_patterns:
    - "(enter|open|geh\\s+in|betrete?|öffne)\\s+(?:the\\s+|die\\s+)?bubble"
    - "switch\\s+to\\s+(?:the\\s+)?bubble"
  # Phase 11.U.H — was direct:spaces.ideas.tools.bubble_tools:enter_bubble
  # (broken: swarm import chain). The planner always prefixes idea ops
  # with a bubble_enter hop; the supabase: ops are stateless (address
  # bubble by id/title directly) so this is a validating no-op that just
  # keeps s1 green so the plan doesn't cascade-fail.
  execution_target: "supabase:bubble.enter"
  arg_kwarg: bubble_name
  validator:
    # truth: ground-truth (2026-06-24) — confirm the entered bubble actually exists
    # ("entered bubble 'X' (id=...)"). on_fail:report so a non-existent bubble is
    # surfaced (REFUTED) without cascade-aborting; an "unverified" enter result has
    # no id -> {result_id} empty -> UNVERIFIED (honest, never a fabricated VERIFIED).
    kind: truth:supabase_row
    on_fail: report
    postcondition:
      check: supabase_row
      table: ideas
      match: "id=eq.{result_id}"
      expect: present

- capability: bubble_exit
  description: "exit the current bubble back to top-level canvas, verlasse die bubble, raus aus der bubble"
