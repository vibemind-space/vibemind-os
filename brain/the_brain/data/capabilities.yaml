  execution_target: "direct:spaces.minibook.tools.minibook_tools:status"
  validator: { kind: "rule:minibook_verified_result", on_fail: "block" }
  agents:
    primary: [brain-knowledge]

- capability: minibook.list_projects
  description: "Lists projects visible through the live Minibook API without changing them."
  match_patterns:
    - '(?:list|show|zeige|liste).{0,20}(?:minibook\s+)?projects|minibook\s+projekte'
  execution_target: "direct:spaces.minibook.tools.minibook_tools:list_projects"
  validator: { kind: "rule:minibook_verified_result", on_fail: "block" }
  agents:
    primary: [brain-knowledge]

# ============================================================
# Society-of-Mind Planner (Phase 3 — Telegram/Voice triggerbar)
# ============================================================
# Generischer Multi-Agent-Planner für komplexe/mehrstufige Aufträge. Telegram-
# Nachrichten (via brain-gateway) + Voice (via multihop) die nach einem Plan
# verlangen, werden hierher geroutet → som-planner OpenFang-Agent → SoM-Pipeline
# (Planner→Executor→Validator→Matrix, mit Feedback-Loop). Status-Push zurück an
# Telegram automatisch. Sensible Daten lokal, Pläne stoppen am Approval-Gate.

- capability: rose.recommend
  description: "Flowzen Blue Rose recommendation from the latest mood and energy check-in; read-only and privacy-minimal"
  anchor_phrases: ["Was empfiehlst du", "Womit soll ich anfangen", "Flowzen Empfehlung"]
  match_patterns:
    - "(was|womit).{0,20}(empfiehl|anfangen|starten)"
    - "(flowzen|rose|blaue rose).{0,20}(empfehl|recommend)"
  execution_target: "supabase:rose.recommend"
  validator: { kind: "rule:flowzen_result", on_fail: "block" }

- capability: rose.accept
  description: "Accept an opaque Flowzen recommendation ID and persist a verified minimal activity marker"
  anchor_phrases: ["Empfehlung annehmen", "Flowzen Empfehlung akzeptieren"]
  match_patterns:
    - "(empfehlung|recommendation).{0,20}(annehmen|akzeptieren|accept)"
  execution_target: "supabase:rose.accept"
  arg_kwarg: recommendation_log_id
  result_arg_extractor: 'regex:(fzr_[0-9a-f]{16})'
  validator: { kind: "rule:flowzen_result", on_fail: "block" }

- capability: rose.status
  description: "Read the latest minimal Flowzen check-in and verified activity status"
  anchor_phrases: ["Flowzen Status", "Status der blauen Rose"]
  match_patterns:
    - "(flowzen|rose|blaue rose).{0,20}(status|stand)"
  execution_target: "supabase:rose.status"
  validator: { kind: "rule:flowzen_result", on_fail: "block" }

- capability: som_plan
  description: "Society-of-Mind Multi-Agent-Planung für komplexe oder mehrstufige Aufträge: zerlegt einen Auftrag in Schritte, bestimmt Ausführung+Agenten, validiert, baut eine Ausführungs-Matrix. Für 'plane X', 'erstelle einen Plan für Y', 'orchestriere Z', mehrstufige Vorhaben mit mehreren Capabilities."
  anchor_phrases:
    - "plane das für mich"
    - "erstelle einen Plan für"
    - "orchestriere die Aufgabe"
    - "wie gehe ich X an"
    - "mach einen Multi-Agent-Plan"
    - "society of mind plan"
  match_patterns:
    - "(plane|erstelle\\s+(?:einen|den)?\\s*plan|orchestriere)\\s+"
    - "(multi.?agent|society.?of.?mind|som)\\s+plan"
    - "wie\\s+(gehe\\s+ich|geht\\s+man|sollte\\s+ich)\\s+.{0,30}(an|vor)"
  execution_target: "openfang:som-planner"
  agents:
    primary: [som-planner]
    supporting: [rowboat-knowledge]

- capability: som_resume
  description: "Beantwortet eine offene SoM-Plan-Rückfrage und nimmt den wartenden Plan wieder auf (oder bricht ihn ab). Greift wenn der SoM-Planner zuvor nach fehlenden Infos / Freigaben gefragt hat. Die Antwort wird dem jüngsten wartenden Run zugeordnet (kein ID-Tippen nötig), 'x' bricht ab."
  anchor_phrases:
    - "antwort"
    - "antworte"
    - "freigabe"
    - "fortsetzen"
    - "weiter mit dem plan"
    - "nimm den plan wieder auf"
  match_patterns:
    # explizite Antwort-Formen (nummeriert, run-Präfix, Abbruch) + 'antwort:'-Trigger
    - "^\\s*antwort\\s*[:=]"
    - "^\\s*run_\\d+\\s*[:.]"
    - "^\\s*\\d+\\s*[:.)]\\s*\\S"
    - "^\\s*x\\s*$"
    - "(setze|nimm)\\s+.{0,20}(plan|run)\\s+.{0,12}(fort|wieder\\s+auf)"
    - "freigabe\\s+(erteilt|ja|ok)"
  execution_target: "openfang:som-resume"
  agents:
    primary: [som-resume]

- capability: som_execute
  description: "Führt einen fertigen (ready) SoM-Plan tatsächlich aus — Schritt für Schritt über die zuständigen Agenten, mit Approval-Gates die vor sensiblen Aktionen (Speichern/Versand) anhalten. Für 'führe den Plan aus', 'los, mach das', 'starte die Ausführung'. Nimmt den jüngsten ready-Plan."
  anchor_phrases:
    - "führe den plan aus"
    - "starte die ausführung"
    - "mach das jetzt"
    - "los, ausführen"
    - "plan ausführen"
  match_patterns:
    - "(führe|fuehre|starte|mach)\\s+.{0,20}(plan|aus|ausführung|ausfuehrung)"
    - "plan\\s+ausf(ü|ue)hren"
    - "^\\s*(los|ausführen|ausfuehren|mach\\s+es)\\s*$"
  execution_target: "openfang:som-execute"
  agents:
    primary: [som-execute]

