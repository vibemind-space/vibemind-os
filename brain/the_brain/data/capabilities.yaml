- capability: idea_link_to_root
  description: "link an idea to the canvas root or back to top-level, verbinde die idee mit dem root"
  anchor_phrases:
    - "link to root"
    - "connect to root"
    - "verbinde mit root"
    - "lift to top"
  match_patterns:
    - "(link|connect|verbinde?|attach)\\s+(?:the\\s+|die\\s+)?ide[ea]n?\\s+(?:to\\s+|mit\\s+(dem\\s+)?)?(?:the\\s+)?(root|top|canvas)"
    - "lift\\s+(?:the\\s+)?ide[ea]n?\\s+to\\s+(top|root)"
  execution_target: "supabase:idea.llm"  # Phase 11.U.H migrated from direct:spaces.* (not in Brain image)
  arg_kwarg: idea_id
  # truth: Phase-1 coverage lift — ground truth via world_observer re-query.
  # idea_llm_op's link_to_root branch creates a real edge (root -> idea)
  # via create_edge — an edge-op, so truth:supabase_edge is the correct
  # kind (verified by reading supabase_ideas_ops.py; NOT
  # truth:supabase_node_in_bubble — the idea's bubble membership doesn't
  # change here, only idea_move actually moves a node between bubbles, so
  # node_in_bubble would trivially always pass and verify nothing new).
  # The op now quotes BOTH endpoints ("Linked 'X' to root 'Y'."), so
  # {result_title}/{result_title2} resolve and the edge re-query fires.
  validator:
    kind: truth:supabase_edge
    on_fail: report
    postcondition:
      check: supabase_edge
      title_a: "{result_title}"
      title_b: "{result_title2}"
      expect: present

