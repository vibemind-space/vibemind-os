# Brain capability registry — Phase 1 (regex routing only).
#
# Each entry is matched in order; first regex hit wins. No regex match →
# router returns None → DiscourseEngine falls back to broadcast (existing
# behavior, unchanged).
#
# All agent names verified live in OpenFang on 2026-05-01:
#     curl http://127.0.0.1:4200/api/agents
#
# Field reference:
#   capability     — short snake_case id, used in trace + stats
#   description    — human readable, also used as semantic-fallback text in Phase 2
#   match_patterns — list of regex strings (case-insensitive)
#   agents.primary — preferred candidates for the dispatch role
#   agents.supporting — additional voices for the discourse round
#   execution_target — Phase 1.5 only; not used by Phase 1 router
#
# Adding a capability: append a new entry, restart Brain. Router validates
# agent names against OpenFang at startup and warns on registry-rot.

- capability: schedule_openclaw_cron
  description: "create a persistent OpenClaw cron job with a validated five-field cron expression"
  match_patterns:
    - "openclaw\\s+cron"
    - "cron\\s+(job|task).*(openclaw)"
  execution_target: "direct:spaces.schedule.execution:openclaw_cron"

- capability: schedule_create
  description: "create a persistent scheduled task, reminder, timer, alarm or appointment"
  match_patterns:
    - "(schedule|create|set|plane|erstelle|stell).*(task|reminder|timer|alarm|termin|erinnerung)"
    - "erinnere mich"
  execution_target: "direct:spaces.schedule.execution:create"

- capability: schedule_cancel
  description: "cancel a scheduled task or reminder"
  match_patterns:
    - "(cancel|delete|lösche|storniere).*(schedule|task|reminder|termin|erinnerung)"
  execution_target: "direct:spaces.schedule.execution:cancel"

- capability: schedule_modify
  description: "modify or reschedule a scheduled task"
  match_patterns:
    - "(modify|change|reschedule|ändere|verschiebe).*(schedule|task|reminder|termin|erinnerung)"
  execution_target: "direct:spaces.schedule.execution:modify"

- capability: schedule_snooze
  description: "snooze a scheduled task or reminder"
  match_patterns:
    - "(snooze|schlummer|später).*(schedule|task|reminder|termin|erinnerung)?"
  execution_target: "direct:spaces.schedule.execution:snooze"

- capability: schedule_status
  description: "show scheduler status and persistent task counts"
  match_patterns:
    - "(schedule|scheduler).*(status|health|zustand)"
  execution_target: "direct:spaces.schedule.execution:status"

- capability: schedule_list
  description: "list persistent scheduled tasks and reminders"
  match_patterns:
    - "(list|show|zeige).*(scheduled|schedule|reminders|termine|erinnerungen)"
  execution_target: "direct:spaces.schedule.execution:list_tasks"
- capability: mirofish.simulate
  description: "start an existing MiroFish simulation as a durable job"
  match_patterns: ["\\bmirofish\\b.*\\b(simulate|simulation starten|simulieren)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:simulate"
  result_arg_extractor: 'regex:\b(sim_[A-Za-z0-9_-]+)\b'
  arg_kwarg: simulation_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }

- capability: mirofish.predict
  description: "generate a prediction report for an existing MiroFish simulation"
  match_patterns: ["\\bmirofish\\b.*\\b(predict|prediction|forecast|vorhersage)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:predict"
  result_arg_extractor: 'regex:\b(sim_[A-Za-z0-9_-]+)\b'
  arg_kwarg: simulation_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }

- capability: mirofish.graph.build
  description: "start a MiroFish graph build job for an existing project"
  match_patterns: ["\\bmirofish\\b.*\\b(graph build|build graph|graph bauen)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:graph.build"
  result_arg_extractor: 'regex:\b(proj_[A-Za-z0-9_-]+)\b'
  arg_kwarg: project_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }

- capability: mirofish.graph.search
  description: "search an identified MiroFish knowledge graph"
  match_patterns: ["\\bmirofish\\b.*\\b(graph search|search graph|graph durchsuchen)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:graph.search"
  result_arg_extractor: 'regex:\b([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\b'
  arg_kwarg: graph_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }

- capability: mirofish.status
  description: "query a MiroFish task, simulation, or report job status"
  match_patterns: ["\\bmirofish\\b.*\\b(status|progress|fortschritt)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:status"
  result_arg_extractor: 'regex:\b((?:task|sim|report)_[A-Za-z0-9_-]+)\b'
  arg_kwarg: job_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }

- capability: mirofish.evaluate
  description: "generate an evidence-backed evaluation report for a MiroFish simulation"
  match_patterns: ["\\bmirofish\\b.*\\b(evaluate|evaluation|bewerten)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:evaluate"
  result_arg_extractor: 'regex:\b(sim_[A-Za-z0-9_-]+)\b'
  arg_kwarg: simulation_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }

- capability: mirofish.interview
  description: "interview an identified agent in a running MiroFish simulation"
  match_patterns: ["\\bmirofish\\b.*\\b(interview|befrage)\\b"]
  agents: { primary: [brain-forecaster], supporting: [] }
  execution_target: "mirofish:interview"
  result_arg_extractor: 'regex:\b(sim_[A-Za-z0-9_-]+)\b'
  arg_kwarg: simulation_id
  validator: { kind: "rule:mirofish_evidence", on_fail: "block" }
