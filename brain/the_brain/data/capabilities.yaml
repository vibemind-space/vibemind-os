- capability: bubble_update
  description: "rename or update a bubble title or description, benenne die bubble um, ändere die bubble"
  anchor_phrases:
    - "rename the bubble"
    - "update the bubble"
    - "benenne die bubble um"
    - "ändere die bubble"
  match_patterns:
    - "(rename|update|benenne(?:\\s+um)?|ändere|ändre|umbenenn)\\s+(?:the\\s+|die\\s+)?bubble"
  execution_target: "supabase:bubble.update"  # Phase 11.U.H migrated from direct:spaces.* (not in Brain image)
  arg_kwarg: bubble_name
  validator:
    # truth: ground-truth (2026-06-24) — re-query that a row with the NEW title
    # exists. {result_title} = the updated title the op reports ("Bubble 'X'
    # updated."), so VERIFIED only if the rename actually persisted (LIVE-verified:
    # claimed-but-not-persisted -> REFUTED).
    kind: truth:supabase_row
    on_fail: report
    postcondition:
      check: supabase_row
      table: ideas
      match: "title=eq.{result_title}"
