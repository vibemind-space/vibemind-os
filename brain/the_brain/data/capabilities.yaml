- capability: minibook.discuss
  description: "Creates a discussion post in a real Minibook project; does not change project lifecycle state."
  match_patterns:
    - "(?:minibook.{0,20})?(?:discuss|discussion|diskussion).+"
  execution_target: "direct:spaces.minibook.tools.minibook_tools:discuss"
  result_arg_extractor: 'regex:(?:discuss|discussion|diskussion)(?:\s+(?:about|über|ueber))?\s+(.+)'
  arg_kwarg: topic
  validator: { kind: "rule:minibook_verified_result", on_fail: "block" }
  agents:
    primary: [brain-knowledge]

- capability: minibook.collaborate
  description: "Creates a collaboration task post inside Minibook without mutating authoritative project lifecycle data."
  match_patterns:
    - "(?:minibook.{0,20})?(?:collaborate|collaboration|zusammenarbeit).+"
  execution_target: "direct:spaces.minibook.tools.minibook_tools:collaborate"
  result_arg_extractor: 'regex:(?:collaborate|collaboration|zusammenarbeit)(?:\s+(?:on|about|zu|über|ueber))?\s+(.+)'
  arg_kwarg: topic
  validator: { kind: "rule:minibook_verified_result", on_fail: "block" }
  agents:
    primary: [brain-knowledge]

- capability: minibook.status
  description: "Reads the live Minibook service status."
  match_patterns:
