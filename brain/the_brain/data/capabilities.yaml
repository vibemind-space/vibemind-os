- capability: idea_auto_link
  description: "automatically detect and create connections between ideas in a bubble based on semantic similarity, auto-link related ideas, find connections automatically"
  anchor_phrases:
    - "auto-link the ideas in this bubble"
    - "find connections between ideas automatically"
    - "automatically connect related ideas"
  match_patterns:
    - "(auto[-\\s]?link|automatically\\s+(?:connect|link))\\s+(?:the\\s+)?ideas"
    - "verbinde\\s+(?:die\\s+|alle\\s+)?ideen\\s+automatisch"
  execution_target: "supabase:idea.auto_link"  # Phase 11.U.C.10
  arg_kwarg: bubble
  # truth: Phase-1 coverage lift — ground truth via world_observer re-query.
  # auto_link_op creates edges (same DB effect as idea_connect), so the
  # semantically-correct kind is truth:supabase_edge. auto_link_op now names
  # one concretely created pair in its result ("... first_pair='A' <-> 'B'"),
  # so {result_title}/{result_title2} resolve and the edge re-query actually
  # fires. When the op linked nothing there is no pair to name and the check
  # stays UNVERIFIED — the honest outcome (nothing was written to verify).
  validator:
    kind: truth:supabase_edge
    on_fail: block
    require_verified: true
    postcondition:
      check: supabase_edge
      title_a: "{result_title}"
      title_b: "{result_title2}"
      expect: present

# ─── Broadcast capabilities (no execution_target — Phase 1 narrowing) ──
# These run the standard discourse round but to a small focused agent set
# instead of broadcasting to all 25.

- capability: code_review
  description: "review code diff pull request changes for bugs style security tests quality"
  match_patterns:
    - "(review|check|critique)\\s+(?:my\\s+|the\\s+|this\\s+)?(?:code|diff|pr|pull request|change)"
    - "code review\\b"
    - "ist (?:das|der code|mein code)\\s+(?:okay|gut|sicher|sauber)"
    - "look (?:at|over)\\s+(?:my\\s+|the\\s+)?code"
  agents:
    primary: [brain-coder, fungus-search]
    supporting: [poc-security-scanner, rowboat-knowledge]
  # When agents respond, aggregator gets a structured prompt asking each
  # for AGREE/DISAGREE + KEY_GAP + NEXT_STEP. Different from the broadcast
  # default ("each propose your own answer") — here the supporting agents
  # are explicitly asked to evaluate the primary's suggestion.
  # Note: feedback_loop on broadcast capabilities is a Phase 2.5 plan;
  # current DiscourseEngine only honors feedback_loop for direct-execution
  # capabilities. This block is documented forward-compat.
  feedback_loop:
    enabled: false  # Phase 2.5 — not wired for broadcast yet
    pattern: proposer_evaluator
    proposer: [brain-coder]
    evaluators: [fungus-search, poc-security-scanner, rowboat-knowledge]

- capability: architecture_question
  description: "explain architecture how does X work understand a system component design decision, walk me through the pipeline routing flow, describe relationship between brain openfang mirofish components, what is the role of, give me an overview"
  anchor_phrases:
    - "walk me through the routing pipeline"
    - "describe the relationship between brain and openfang"
    - "explain how the discourse engine works"
    - "what is the role of fungus search"
    - "give me an overview of the architecture"
  match_patterns:
    # Be strict — require Vibemind/Brain domain words to avoid catching
    # general "how does X work" off-domain queries (e.g. "how does cooking work").
    - "(how|wie)\\s+(?:does|do|is|are|funktioniert)\\s+(?:the\\s+|der\\s+|die\\s+|das\\s+)?(brain|mirofish|openfang|fungus|capability|router|discourse|agent|bubble|tribe|pipeline|architecture|system)"
    - "(explain|erklär|erkläre)\\s+(?:the\\s+|how\\s+|wie\\s+)?(brain|mirofish|openfang|fungus|capability|router|discourse|agent|bubble|architecture|system|pipeline)"
    - "(architecture|architektur) (of|für|von)"
  agents:
    primary: [fungus-search, brain-coder]
    supporting: [rowboat-knowledge]

# ─── Phase 11.N: Bubble + Idea CRUD/Navigation ──────────────────────
# Routing-Capabilities für die restlichen Ideas-Space MCP-Tools.
# Pattern wie bei den Format-Tools: anchor_phrases + match_patterns + direct: target.

- capability: bubble_list
  description: "list all bubbles in the canvas, show me my bubbles, welche bubbles habe ich, alle blasen anzeigen"
  anchor_phrases:
    - "list all bubbles"
    - "show me my bubbles"
    - "welche bubbles gibt es"
    - "zeig mir alle bubbles"
    - "alle blasen auflisten"
  match_patterns:
    - "(list|liste|zeig(e)?)\\s+(?:all\\s+|alle\\s+)?(bubbles?|blasen?)"
    - "(welche|which)\\s+(bubbles?|blasen?)"
    - "(meine|my)\\s+(bubbles?|blasen?)"
  execution_target: "supabase:bubble.list"  # Phase 11.U.H migrated from direct:spaces.* (not in Brain image)
  arg_kwarg: query
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: bubble_find
  description: "find a specific bubble by name or fuzzy match, locate the bubble called X, wo ist die bubble Y"
  anchor_phrases:
    - "find the bubble"
    - "where is the bubble"
    - "wo ist die bubble"
    - "such die bubble"
  match_patterns:
    - "(find|finde|such(e)?|locate)\\s+(?:the\\s+|die\\s+)?bubble"
    - "(where|wo)\\s+(is|ist)\\s+(?:the\\s+|die\\s+)?bubble"
  execution_target: "supabase:bubble.find"  # Phase 11.U.H migrated from direct:spaces.* (not in Brain image)
  arg_kwarg: name
  validator:
    kind: rule:string_nonempty
