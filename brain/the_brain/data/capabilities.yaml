    - "trenne die ideen"
    - "lösche die verbindung"
  match_patterns:
    - "(disconnect|unlink|trenne|entferne\\s+(die\\s+)?verbindung|l(ö|oe)sche?\\s+(die\\s+)?verbindung)\\s+(?:the\\s+|die\\s+)?ide[ea]n?"
    - "remove\\s+(?:the\\s+)?(connection|edge|link)\\s+between"
    - "trenne\\s+\\S+\\s+und\\s+\\S+"
  execution_target: "supabase:idea.disconnect"  # Phase 11.U.C.10
  arg_kwarg: idea1  # primary; idea2 re-extracted from _intent
  validator:
    # truth: ground-truth (2026-06-24) — confirm the edge between the two ideas is GONE.
    # {result_title}+{result_title2} from "Connection between 'X' and 'Y' removed."
    kind: truth:supabase_edge
    on_fail: block
    require_verified: true
    postcondition:
      check: supabase_edge
      title_a: "{result_title}"
      title_b: "{result_title2}"
