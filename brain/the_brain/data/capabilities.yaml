    - "(create|spawn|build|make)\\s+(an?\\s+)?(new\\s+)?(openfang\\s+)?agent\\b"
    # German: erstelle/baue/starte/spawn [einen] [neuen] [openfang] agent[en]
    - "(erstelle|baue|spawn|starte|create)\\s+(einen?\\s+)?(neuen?\\s+)?(openfang[- ]?)?agent(en)?\\b"
    # Explicit "openfang agent" subject + verb in any order
    - "openfang[- ]?agent\\s+(create|spawn|build|erstelle|anlegen|bauen|starten)"
    # List request — also routes here for the "what's running" sub-question
    - "(list|zeig\\w*|show|liste)\\s+(all\\s+|alle\\s+)?(openfang\\s+)?agents?\\b"
  # Phase 2 (Sofort-Fix 2026-05-20): route to fungus-search (Running, claude-code
  # provider, has MCP access via :4200/mcp aggregator). The agent sees the user
  # intent via /api/agents/{id}/message and uses its MCP tools (incl. the new
  # openfang-agents server) to spawn/patch/kill via natural language.
  # → Brain → OpenFang Claude-Agent → MCP-Tools → :4200/api/agents (Variante 2)
  #
  # Phase 4 follow-up (deferred — needs /api/mcp/dispatch route in Brain):
  # execution_target: "mcp:openfang-agents:openfang_agent_spawn_from_template"
  # would be the deterministic direct-call variant. McpExecutor in
  # capability_targets.py:621 is currently a Phase-4 stub that POSTs to a
  # non-existent /api/mcp/dispatch route. Until that route is implemented,
  # use the openfang: target above.
  execution_target: "openfang:fungus-search"
  # Try to extract the template/role name from the intent:
  # "agent for code-review", "agent namens X", "agent named X"
  result_arg_extractor: 'regex:agent\s+(?:for|für|named|namens)\s+(.+?)(?:\s+(?:with|mit|using|und|and)|$)'

