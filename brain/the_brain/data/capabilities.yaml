# ──────────────────────────────────────────────────────────────────────────
# Phase 11+ — OpenFang-agent dispatch via `openfang:<agent>` execution_target
# Added 2026-05-13. Bridge: Voice/User → Brain.think → CapRouter → OpenFangExecutor
# → POST /api/agents/<id>/message. The executor (capability_targets.py) resolves
# agent_name → agent_id via /api/agents.
# ──────────────────────────────────────────────────────────────────────────

- capability: code_generate
  description: "Generate code through the health-checked coding-engine control server."
  match_patterns: ["^code\\.generate$", "^(generate|create|erstelle?|generiere?)\\s+(code|projekt|project)"]
  execution_target: "coding-engine:POST:/api/start"
  arg_kwarg: description
  validator: {kind: "rule:non_empty_result", on_fail: report}

- capability: code_modify
  description: "Modify code through the health-checked coding-engine control server."
  match_patterns: ["^code\\.modify$", "^(modify|edit|ändere?|bearbeite?)\\s+(code|datei|file)"]
  execution_target: "coding-engine:POST:/api/start"
  arg_kwarg: description
  validator: {kind: "rule:non_empty_result", on_fail: report}

- capability: code_status
  description: "Read the current coding-engine execution status."
  match_patterns: ["^code\\.status$", "^(code|coding)[ -]?(status|fortschritt)$"]
  execution_target: "coding-engine:GET:/api/status"
  validator: {kind: "rule:non_empty_result", on_fail: report}

- capability: code_show
  description: "Show coding-engine execution logs and visible results."
  match_patterns: ["^code\\.show$", "^(show|zeige?)\\s+(code|coding)[ -]?(result|ergebnis|logs?)"]
  execution_target: "coding-engine:GET:/api/logs"
