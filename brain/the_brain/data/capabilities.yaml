- capability: coding_task_anthropic
  description: "EXECUTE CODE TASK with the Claude Pro/Max subscription through official Claude Code. Use only when the user explicitly selects Claude or Anthropic; writes real files to disk, runs them, and returns output."
  coding_provider: anthropic
  anchor_phrases:
    - "use Claude to fix the failing test in tests/test_foo.py"
    - "use Anthropic to fix tests/test_foo.py"
    - "mit Anthropic die Funktion in src/main.py schreiben"
    - "mit Claude die Funktion in src/main.py schreiben"
    - "Claude Code verwenden und den Fehler in app.py beheben"
    - "Anthropic verwenden und app.py reparieren"
  match_patterns:
    # A provider selector alone is not a coding request. Require a bounded
    # coding operation plus a code artifact, repository object, or deployment
    # target so ordinary Claude chat stays out of this execution route.
    - "(?=.*\\b(?:claude|anthropic)\\b)(?=.*\\b(?:fix|debug|repair\\w*|reparier\\w*|beheb\\w*|write|create|implement|refactor|modify|edit|rename|move|delete|remove|merge|checkout|check\\s+out|rebase|clone|pull|deploy|schreib\\w*|erstell\\w*|ändere\\w*|lösch\\w*|f[üu]hr\\w*)\\b)(?=.*(?:\\.(?:py|js|ts|tsx|jsx|rs|go|java|cpp|c|h|hpp|rb|php|sh|cmd)\\b|\\b(?:endpoint|api|source\\s+code|codebase|datei|files?|git\\s+branch|branch|repository|repo|build)\\b|\\b(?:(?:refactor|debug)\\s+(?:this|the|a|an)?\\s*(?:function|funktion|class|klasse|module|modul)|(?:python|javascript|typescript|rust|code|source)\\s+(?:function|funktion|script|skript|class|klasse|module|modul)|(?:bug|error|issue|fehler)\\s+(?:in|inside|within)\\s+(?:auth|code|source|codebase|function|funktion|class|klasse|module|modul|api|endpoint|repository|repo|build|tests?|files?)|(?:software|code|source)\\s+(?:project|application|service|test)|(?:project|application|service|test)\\s+(?:code|source|repository|repo|module|endpoint|build|deployment|suite)|(?:unit|integration|failing)\\s+tests?)\\b)).*"
    # Read/run/review/search requests may omit an extension but must still name
    # a bounded source-code or repository object. This preserves generic
    # review/search collisions handled by earlier capabilities.
    - "(?=.*\\b(?:claude|anthropic)\\b)(?=.*\\b(?:run|execute|review|inspect|check|search|find|locate|ausf[üu]hr\\w*|prüf\\w*|such\\w*)\\b)(?=.*(?:\\.(?:py|js|ts|tsx|jsx|rs|go|java|cpp|c|h|hpp|rb|php|sh|cmd)\\b|\\b(?:tests?|source\\s+code|codebase|repository|repo|files?)\\b)).*"
    # Concrete repository lifecycle and known deployment targets are also
    # provider-selected coding work without requiring a source extension.
    - "(?=.*\\b(?:claude|anthropic)\\b)(?=.*(?:\\b(?:create|setup|init|erstell|leg)\\b.*\\bgithub\\s+repo\\b|\\bdeploy\\b.*\\b(?:vercel|cloudflare|digitalocean|fly\\.io|aws|azure|gcp|render|railway|netlify|heroku|kubernetes|k8s|docker|production|staging|server)\\b|\\b(?:commit|push)\\b.*\\b(?:changes?|änderung)\\b)).*"
  execution_target: "openfang:brain-coder-anthropic"
  validator:
    # truth: ground-truth (2026-06-25) — the coding agent claims it wrote a file;
    # confirm the file actually exists on disk (same host). {result_path} = first
    # absolute path in the result ("written to `C:/.../x.py`"). No path in the
    # result -> UNVERIFIED (honest), reusing world_observer.file_exists.
    kind: truth:file_exists
    on_fail: report
    postcondition:
      check: file_exists
      path: "{result_path}"

- capability: coding_task
  description: "EXECUTE CODE TASK — actually write/edit/run real source code on disk through the ChatGPT subscription via OpenCode. NOT for adding ideas/notes to the knowledge graph (that's idea_add). NOT for searching code (that's code_search). NOT for reviewing code (that's code_review). USE THIS when the user wants the system to actually CREATE OR MODIFY a code file: write a python/js/ts/rust function or script, fix a bug in a specific source file, refactor existing code, implement an API endpoint, run git commit/push, create a github repo, deploy to vercel. This is the deterministic default coding route; it writes real files to disk, runs them, and returns output."
  coding_provider: openai
  anchor_phrases:
    - "write a python script that prints hello and save it as hello.py"
    - "create a function add_two in src/main.py and run the file"
    - "fix the failing test in tests/test_foo.py"
    - "refactor the parse_url function in utils.py to handle edge cases"
    - "implement a /health endpoint in src/main.py"
    - "create a github repository for my project and push the code"
    - "deploy this project to vercel as a preview"
    - "schreib mir ein lauffähiges python script das hello.py heißt und Hello druckt"
    - "erstelle die funktion add_two in src/main.py und führe sie aus"
    - "leg mir ein github repo an und pushe den code dorthin"
  match_patterns:
    # File-extension is a strong signal that the user wants ACTUAL code on disk
    # CapabilityRouter's provider-intent gate allows this default only for
    # OpenAI/default intent, never for explicit Anthropic intent or conflicts.
    - "\\.(py|js|ts|tsx|jsx|rs|go|java|cpp|c|h|hpp|rb|php|sh|cmd)\\b"
    # German + English code-creation verbs with stack keyword nearby
    - "(write|create|schreib|erstell)\\s+(a|an|me|mir|ein|eine)?\\s*(python|js|ts|rust|go|java)\\s+(function|class|script|module|funktion|klasse)"
    - "(write|schreib)\\s+(me|mir)\\s+(a|an|ein|eine)?\\s*(python|js|ts)\\s+(function|funktion|script|skript)"
    # Verb + stack-name (looser — catches "schreib mir ein python script das X")
    - "(write|create|schreib|erstell)\\s+\\w+\\s+(python|js|ts|rust|go|java)\\s+\\w+"
    # Bug-fix style
    - "(fix|debug)\\s+(the|a)?\\s*(bug|error|issue|fehler)\\s+in"
    - "refactor\\s+(this|the)?\\s*(function|class|file|module|funktion|datei)"
    - "implement\\s+(a|the|new)?\\s*(feature|endpoint|api)"
    # Concrete git/deploy operations
    - "(create|setup|init|erstell|leg)\\s+(a|my|ein|mein)?\\s*github\\s+repo"
    - "deploy\\s+(to|on|auf)\\s+vercel"
    - "(commit|push)\\s+(this|my|den|meinen)?\\s*(changes?|änderung)"
    # Last-resort: stack + thing-noun pair
    - "(eine?|a|ein)\\s+(python|js|ts|rust|go)\\s+(funktion|function|script|skript|class|klasse)"
  execution_target: "openfang:brain-coder-openai"
  validator:
    # truth: ground-truth (2026-06-25) — the coding agent CLAIMS it wrote a file;
    # confirm the file actually exists on disk (same host). {result_path} = first
    # absolute path in the result ("written to `C:/.../x.py`"). No path in the
    # result -> UNVERIFIED (honest), reusing world_observer.file_exists.
    kind: truth:file_exists
    on_fail: report
    postcondition:
      check: file_exists
      path: "{result_path}"

- capability: desktop_skill
  description: "automate excel word powerpoint outlook chrome desktop apps, fill cells type text click buttons, hr workflows like onboarding offboarding timesheet payroll, anything requiring UI automation on the user's Windows desktop with telegram approval"
  anchor_phrases:
    - "fill excel cell A1 with hello"
    - "open word and write a letter"
    - "create the hr onboarding checklist"
    - "fülle die zelle A1 mit hallo"
    - "öffne excel und mach X"
    - "erstelle einen stundenzettel"
    - "klick auf den OK button"
  match_patterns:
    - "(fill|set|fülle|setze)\\s+.*\\b(zelle|cell)\\s+[A-Z]\\d+"
    - "(open|öffne|starte)\\s+(excel|word|powerpoint|outlook|chrome|firefox)"
    - "(create|erstelle)\\s+.*\\b(stundenzettel|onboarding|offboarding|gehaltsabrechnung|payroll|timesheet)"
    - "(click|klick)\\s+(on|auf)?\\s+(the|den|die|das)?\\s*\\w+\\s+(button|knopf)"
    - "type\\s+\\\".+\\\"\\s+in\\s+(the|der|die|das)?\\s*\\w+\\s+(field|feld)"
    # Desktop-Screenshot NUR mit explizitem Desktop/Fenster/App-Bezug. Das nackte
    # "screenshot" klaute first-match-wins auch Website-Screenshots
    # ("screenshot von github.com" -> faelschlich skill-coordinator statt
    # browser_automation/openclaw-visible). Verifiziert Intent-Validierung Kat-6.
    - "\\b(bildschirm|desktop|screen|fenster|window|monitor|app|anwendung|programm)\\b.{0,15}screenshot|screenshot\\b.{0,20}\\b(bildschirm|desktop|screen|fenster|window|monitor|app|anwendung|programm)"
    - "(automate|automatisier)\\s+\\w+"
  execution_target: "openfang:skill-coordinator"

- capability: browser_automation
  description: "browse the web, navigate to a url, scrape a page, fill out a web form, click links in browser, take a screenshot of a website, do web research, login to a website, extract data from a webpage"
  anchor_phrases:
    - "navigate to https://example.com"
    - "open the website X and screenshot it"
    - "fill out the contact form on Y"
    - "scrape product prices from Z"
    - "gehe auf die webseite X und klick auf Y"
    - "such mir im web nach X"
    - "log dich bei X ein"
    - "extrahier alle links von dieser seite"
  match_patterns:
    # URL present + a browse verb (covers DE 'navigiere/öffne/gehe' + EN)
    - "(navigate|navigier|go|open|öffne|browse|gehe?|surf|besuche?)\\w*\\s+(to|zu|zur|auf|nach)?\\s*https?://"
    # any explicit http(s) URL with a browse-ish verb anywhere before it
    - "(navigiere|navigate|öffne|browse|scrape|screenshot|besuche)\\b.{0,40}https?://"
    - "(scrape|extract|grab|extrahier)\\w*\\s+.*\\b(page|website|webpage|site|seite|webseite)"
    - "(fill|complete|fülle?|ausfüllen)\\s+.*\\b(form|formular)\\b"
    # login: deckt "logge dich bei X ein" / "melde dich bei X an" mit Woertern
    # dazwischen ab (alte Form verlangte "melde dich an" als Block, "logge..ein"
    # fehlte ganz). Intent-Validierung Kat-6.
    - "(login|log\\s?in|einlog\\w*|logg?e?\\s+(dich|mich)\\s+.{0,25}\\bein\\b|melde?\\s+(dich|mich)\\s+.{0,25}\\ban\\b|melde?\\s+(dich|mich)\\s+an)"
    - "(take|grab|mach|erstell)\\w*\\s+(a|ein|einen)?\\s*screenshot\\s+(of|von|der|des)?\\s*(the|a|der|die|das)?\\s*(website|page|webpage|webseite|seite)"
    # Screenshot einer bloßen Domain ohne http:// und ohne das Wort "website"
    # ("screenshot von github.com") — sonst faellt es zwischen die Stuehle
    # (desktop_skill desktop-scoped, browser verlangte website/http). Kat-6-Fix.
    - "screenshot\\s+(von|of|der|des|the|a|einen?)?\\s*[\\w.-]+\\.(com|org|net|io|de|gov|edu|co|app|dev|ai)"
    - "(gehe|geh|navigiere|navigate|öffne|besuche)\\s+(zur?|auf|to|nach)?\\s*(die|the)?\\s*(webseite|website|seite|url|web\\s?site)"
    # "öffne (sichtbar) (die) seite/website X" — fiel sonst durch zu site_check
    # (broadcast-only, kein execution_target -> Fehler). Verb + opt. Fueller
    # (sichtbar/mir/zur/...) + seite/website. Faengt NICHT "öffne excel" (Desktop)
    # oder "ist die seite erreichbar" (site_check). Intent-Validierung Kat-6.
    - "(öffne|oeffne|zeig\\w*|besuche?|navigiere|geh\\w*|open|show|visit)\\s+(sichtbar\\s+|visible\\s+|mir\\s+|mal\\s+|uns\\s+|zur?\\s+|auf\\s+|to\\s+|nach\\s+)*(die\\s+|the\\s+|von\\s+)?(seite|website|webseite|web\\s?site|url|page)\\b"
    - "(web\\s?research|deep research|recherchiere?\\s+im\\s+(web|netz|internet))"
    # 2026-05-19: natural site requests without https:// or the word
    # "webseite" (e.g. "öffne gmail", "geh auf youtube", "gmail aufmachen")
    # previously fell through to the unreliable LLM planner -> wrong cap /
    # example.com fallback. These hit the deterministic shortcut instead.
    # (a) browse-verb + a domain-looking token (foo.com / mail.google.de)
    - "(gehe|geh|navigiere|navigate|öffne|open|besuche|surf|zeig\\w*\\s+mir|check|geh\\s+auf|ruf\\w*\\s+auf)\\s+(zur?|auf|to|nach|die|the|mal)?\\s*[\\w-]+\\.(com|de|org|net|io|co|ai|app|dev|me|tv|gov|edu)\\b"
    # (b) browse-verb + a well-known site name (no TLD/scheme needed)
    - "(gehe|geh|navigiere|navigate|öffne|open|besuche|surf|zeig\\w*\\s+mir|check|geh\\s+auf|mach\\w*\\s+auf|ruf\\w*\\s+auf)\\s+(zur?|auf|to|nach|die|the|mal|meine?|mein)?\\s*(gmail|google|youtube|amazon|github|gitlab|reddit|twitter|x\\.com|linkedin|facebook|instagram|wikipedia|whatsapp|telegram|netflix|spotify|chatgpt|claude|openai|stackoverflow|ebay|paypal|outlook|yahoo|bing|duckduckgo|maps|gmaps|drive|dropbox|notion|slack|discord|twitch|tiktok|pinterest|booking|airbnb|aliexpress|otto|zalando|dhl|deutsche\\s?bahn|bahn|wetter|tagesschau|spiegel|heise|golem)\\b"
    # (c) bare well-known site name as the whole/lead intent ("gmail",
    # "gmail aufmachen", "youtube öffnen")
    - "^\\s*(gmail|youtube|github|gitlab|amazon|reddit|linkedin|wikipedia|netflix|spotify|chatgpt|stackoverflow|outlook)\\b(\\s+(öffnen|aufmachen|aufrufen|zeigen|checken|open|show)\\b)?\\s*$"
    # (d) German separable-verb bracket: "mach/ruf <site> auf",
    # "<site> öffnen/aufmachen" (verb after the site name)
    - "(mach\\w*|ruf\\w*|öffne|zeig\\w*|geh\\w*)\\s+(zur?|auf|die|mal|meine?|mein)?\\s*(gmail|google|youtube|amazon|github|gitlab|reddit|twitter|linkedin|facebook|instagram|wikipedia|whatsapp|telegram|netflix|spotify|chatgpt|claude|openai|stackoverflow|ebay|paypal|outlook|yahoo|maps|drive|dropbox|notion|slack|discord|twitch|tiktok|booking|airbnb|otto|zalando|dhl|bahn|wetter|tagesschau|spiegel|heise|golem)\\b\\s*(auf|aufmachen|aufrufen|öffnen|anzeigen|zeigen)\\b"
  # Routes to openclaw-visible: the agent turn goes through the NATIVE
  # openclaw Gateway (ws://127.0.0.1:18793), driving a VISIBLE Chrome
  # window on the host PC (the user can watch). Sibling openclaw-coder
  # still exists for HEADLESS container browser_automation if ever needed.
  # Built + verified end-to-end 2026-05-19 (plan
  # k-nnnen-wir-adative-skills-splendid-mochi.md).
  execution_target: "openfang:openclaw-visible"

