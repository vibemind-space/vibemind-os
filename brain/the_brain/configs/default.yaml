# Service ports (override with env vars)
ports:
  unified_brain: 5003
  dashboard: 5004
  swarm: 5002
  api: 5001
  memory: 8001
  oscillator: 5005

# Directory paths (override with env vars)
directories:
  session_logs: "data/logs/sessions"
  episodic_memory: "data/episodic_memory"
  trained_matrices: "production/trained_matrices"
  feedback: "production/feedback"
  ctm_checkpoints: "data/ctm_checkpoints"

# Moltbook — Decentralized Knowledge & Thinking System
moltbook:
  # Core settings
  max_entries: 50000
  embedding_dim: 384
  similarity_threshold: 0.7

  # Thought stream
  thought_stream_interval_ms: 200
  thought_buffer_size: 100

  # Retrieval
  speculative_retrieval_depth: 3
  markov_lookahead: 2
  top_k_entries: 10
  workspace_capacity: 7        # Lisman-Jensen 7±2

  # Decay (Ebbinghaus-inspired)
  decay_rate: 0.001
  emotional_decay_multiplier: 0.3
  access_boost: 0.1

  # Performance targets
  retrieval_timeout_ms: 5
  think_budget_ms: 500
  speak_budget_ms: 200

  # Forgetting (activation-based eviction)
  eviction_threshold: 0.01          # Entries below this activation are forgotten
  max_tombstones: 1000              # In-memory tombstone log cap

  # Persistence
  store_path: "data/moltbook/store.jsonl"
  index_path: "data/moltbook/index.faiss"
  graph_path: "data/moltbook/graph.json"
  markov_path: "data/moltbook/markov.json"
  tombstone_path: "data/moltbook/tombstones.jsonl"

  # Agents
  enable_background_agents: true
  agent_schedule_interval_s: 60
  max_agent_searches_per_day: 100

  # Debug
  enable_debug_stream: false

# Radial Attention Network — learned intelligence core
radial_attention:
  seed_dim: 384
  thalamic_dim: 128
  dropout: 0.1
  hebbian_learning_rate: 0.001
  hebbian_decay: 0.0001
  sleep_training_lr: 0.001
  ewc_lambda: 100.0
  experience_buffer_size: 5000
  conflict_threshold: 0.3
  enable_radial: true

# Neuromodulation Bridge — connects brain modules to Radial Attention
neuromodulation_bridge:
  enabled: true

# Cortex Bridge — connects PFC + ACC + OFC to Radial Attention
cortex_bridge:
  enabled: true

limbic_bridge:
  enabled: true

sleep_wake_bridge:
  enabled: true

motor_bridge:
  enabled: true

defense_bridge:
  enabled: true

memory_bridge:
  enabled: true

integration_bridge:
  enabled: true

visceral_bridge:
  enabled: true

social_perception_bridge:
  enabled: true

# Minibook -- multi-agent collaboration platform (Phase 10)
minibook:
  enabled: true
  base_url: "http://localhost:8800"
  api_key: ""
  agent_name: "Tahlamus"
  heartbeat_interval: 60            # Seconds between heartbeats
  poll_interval: 30                 # Seconds between notification polls
  auto_reply: false                 # Auto-reply to @mentions (gated by ApprovalGate)
  max_reply_length: 2000            # Max characters per reply

# MCP Server -- JSON-RPC 2.0 brain state exposure (Phase 10)
mcp_server:
  enabled: true
  host: "127.0.0.1"
  port: 8900

# Logging
logging:
  level: "INFO"
  save_interval: 10     # save metrics every N steps
  log_dir: "data"
  csv_format: true
  plot_format: "png"
