# Security Scanner - Distributed Agent System
#
# Architecture:
#   host:     gRPC coordinator (Port 50053 external)
#   scanner:  Worker with 4 agents (Orchestrator, Scanner, Analyzer, Reporter)
#
# Usage:
#   docker compose build
#   docker compose up

services:
  host:
    build:
      context: .
      dockerfile: Dockerfile.host
    container_name: scanner-host
    ports:
      - "50053:50051"
    networks:
      - scanner-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",50051)); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 10

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scanner-worker
    depends_on:
      host:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - SCAN_TARGET=host
      - SCAN_PORTS=22,80,443,8080,50051,2375,2376,5000,9090,27017,6379
      - SCAN_TYPES=ports,grpc_auth,tls,docker_bind
    networks:
      - scanner-net

networks:
  scanner-net:
    driver: bridge
