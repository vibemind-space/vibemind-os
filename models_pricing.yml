# =============================================================================
# Model Pricing — input/output cost per 1M tokens (USD)
# =============================================================================
# Used by vibemind_shared.estimate_cost() and the cost dashboard.
# Local models (ollama) are free.
#
# Update from official pricing pages:
#   OpenAI:     https://openai.com/api/pricing/
#   Anthropic:  https://www.anthropic.com/pricing#anthropic-api
#   OpenRouter: https://openrouter.ai/models  (per-model)
#   Google:     https://ai.google.dev/pricing
# =============================================================================

# Format: model_id: { input: $/1M, output: $/1M, context: tokens }

# ── OpenAI ──────────────────────────────────────────────────────────────────
gpt-4o:
  provider: openai
  input: 2.50
  output: 10.00
  context: 128000

gpt-4o-mini:
  provider: openai
  input: 0.15
  output: 0.60
  context: 128000

gpt-4o-realtime-preview:
